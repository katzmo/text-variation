<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text variation sequences</title>
    <!-- https://github.com/TEIC/CETEIcean/releases -->
    <script src="CETEI.min.js"></script>
    <!-- custom styles -->
    <link rel="stylesheet" href="tei.css" />
    <style>
      body {
        padding: 3rem;
        font-family: sans-serif;
      }
      #sequences {
        --zoom-level: 25%;
        --text-color: #333;
        display: flex;
        column-gap: max(1%, 1rem);
        padding: max(1%, 1rem);
        overflow: scroll;
        cursor: default;
        zoom: var(--zoom-level);
        font-size: min(var(--zoom-level), 100%);
        color: rgba(50, 50, 50, var(--zoom-level));

        > * {
          margin-bottom: auto;
          background-color: white;
          min-width: 22em;
          max-width: 100em;
          transition: margin 0.3s ease;
        }

        .reference {
          /*position: sticky;
          left: 0;
          right: 0;*/
          border: 3px solid #888;
          box-shadow: 0 0.5em 1em #0008;
        }

        .identifier {
          cursor: pointer;
          color: #333;
          text-align: center;
          justify-self: center;
          display: inline-block;
          zoom: max(calc(150% / var(--zoom-level)));
          background-color: #ccc;
          border-radius: 10rem;
          padding: 0.5em;
        }

        .text-segment {
          display: block;
          text-align: justify;
          background-color: var(--bg-color, blanchedalmond);
          padding: 0.5em;
          transition: filter 400ms ease-in-out;
        }
        .text-segment.highlight:not(.aligned) {
          filter: brightness(0.8);
        }
        .text-segment.aligned {
          outline: 3px solid #888;
          outline-offset: min(0.2rem, 0.5em);
          box-shadow:
            3rem 0 0 -2rem #888,
            -3rem 0 0 -2rem #888;
        }
      }
    </style>
    <script type="module">
      // Initialize CETEIcean
      const c = new CETEI()
      c.addBehaviors({
        tei: {
          // Display document ID
          TEI: (el) => {
            const xmlId = el.getAttribute("xml:id")
            if (xmlId) {
              el.insertAdjacentHTML(
                "afterbegin",
                `<div class="identifier">${xmlId}</div>`,
              )
            }
          },
          // Add paragraphs with "text-segment" class + data-id to sections
          section: ["<p class='text-segment' data-id='$@n'>", "</p>"],
        },
      })
      for (const file of [
        "data/darwin1859.xml",
        "data/darwin1860.xml",
        "data/darwin1861.xml",
        "data/darwin1866.xml",
        "data/darwin1869.xml",
        "data/darwin1872.xml",
      ]) {
        const data = await c.getHTML5(file)
        document.getElementById("sequences").appendChild(data)
      }
    </script>
  </head>
  <body>
    <h1>Test view</h1>
    <p>To zoom, use +/- keys or press Ctrl/Cmd and scroll.</p>
    <p>Click on a text segment to align the bars on it.</p>
    <p>
      Click on an identifier label to select the text as reference and color
      segments by position.
    </p>

    <div id="sequences"></div>

    <script>
      const wrapper = document.getElementById("sequences")

      // Highlight and align segments
      // ----------------------------
      function alignSections(targetElements) {
        // Find the greatest offset of target from column start
        let maxOffsetTop = 0

        targetElements.forEach((element) => {
          const column = element.closest("tei-tei")
          if (!column) return

          const offsetFromColumnStart = element.offsetTop - column.offsetTop
          maxOffsetTop = Math.max(maxOffsetTop, offsetFromColumnStart)
        })

        // Push every column so its target is at that offset from container top
        targetElements.forEach((element) => {
          const column = element.closest("tei-tei")
          if (!column) return

          const offsetFromColumnStart = element.offsetTop - column.offsetTop
          const marginNeeded = maxOffsetTop - offsetFromColumnStart
          column.style.marginTop = marginNeeded + "px"
        })

        // Scroll the first target into view
        if (targetElements.length > 0) {
          targetElements[0].scrollIntoView({
            behavior: "smooth",
            block: "center",
          })
        }
      }

      function findMatchingSections(wrapper, section) {
        id = section.dataset.id
        if (!id) return []
        return wrapper.querySelectorAll(`[data-id="${id}"]`)
      }

      // Add hover background
      wrapper.addEventListener("mouseover", (event) => {
        findMatchingSections(wrapper, event.target).forEach((elem) => {
          elem.classList.add("highlight")
        })
      })
      // Remove hover background
      wrapper.addEventListener("mouseout", (event) => {
        findMatchingSections(wrapper, event.target).forEach((elem) => {
          elem.classList.remove("highlight")
        })
      })
      // Align on click
      wrapper.addEventListener("click", (event) => {
        const targets = findMatchingSections(wrapper, event.target)
        if (!targets.length) return
        wrapper.querySelectorAll(".text-segment.aligned").forEach((elem) => {
          elem.classList.remove("aligned")
        })
        alignSections(targets)
        targets.forEach((elem) => {
          elem.classList.add("aligned")
        })
      })

      // Zoom with +/- or mouse
      // ----------------------
      let currentZoom = parseFloat(
        getComputedStyle(wrapper).getPropertyValue("--zoom-level"),
      )
      const minZoom = 10
      const maxZoom = 150
      const zoomStep = 5

      updateZoom()

      // Scroll wheel zoom
      wrapper.addEventListener(
        "wheel",
        (e) => {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault()
            if (e.deltaY < 0) {
              zoomIn()
            } else {
              zoomOut()
            }
          }
        },
        { passive: false },
      )

      // Keyboard shortcuts
      document.addEventListener("keydown", (e) => {
        if (e.key === "+") {
          e.preventDefault()
          zoomIn()
        } else if (e.key === "-") {
          e.preventDefault()
          zoomOut()
        }
      })

      function zoomIn() {
        if (currentZoom + zoomStep < maxZoom) {
          currentZoom += zoomStep
          updateZoom()
        }
      }

      function zoomOut() {
        if (currentZoom - zoomStep > minZoom) {
          currentZoom -= zoomStep
          updateZoom()
        }
      }

      function updateZoom() {
        wrapper.style.setProperty("--zoom-level", currentZoom + "%")
        alignSections(wrapper.querySelectorAll(".text-segment.aligned"))
      }

      // Reference text + color by position
      //-----------------------------------
      wrapper.addEventListener("click", (event) => {
        if (event.target.classList.contains("identifier")) {
          event.preventDefault()
          // Set "reference" class
          wrapper.querySelector(".reference")?.classList.remove("reference")
          const reference = event.target.parentElement
          reference.classList.add("reference")
          // Distribute colors over segments
          wrapper.querySelectorAll(".text-segment").forEach((element) => {
            element.style.setProperty("--bg-color", `#eee`) // default, not in reference
          })
          const segments = reference.querySelectorAll(".text-segment")
          segments.forEach((segment, index) => {
            const hue = (index / segments.length) * 270 + 60 // Distribute hues across 360°
            findMatchingSections(wrapper, segment).forEach((target) => {
              target.style.setProperty("--bg-color", `hsl(${hue}, 60%, 80%)`)
            })
          })
        }
      })
    </script>
  </body>
</html>
